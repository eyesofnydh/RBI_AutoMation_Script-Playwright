name: RBI E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test'
        default: 'https://stg-rbi.webc.in'
  schedule:
    - cron: '30 1 * * *' # nightly 07:00 IST
  push:
    branches: [main]

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || 'https://stg-rbi.webc.in' }}
      HTTP_USER: ${{ secrets.HTTP_USER }}
      HTTP_PASS: ${{ secrets.HTTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run crawl
      - uses: actions/upload-artifact@v4
        with: { name: crawl-cache, path: .cache/ }

  test:
    needs: crawl
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      BASE_URL: ${{ inputs.base_url || 'https://stg-rbi.webc.in' }}
      HTTP_USER: ${{ secrets.HTTP_USER }}
      HTTP_PASS: ${{ secrets.HTTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: crawl-cache, path: .cache/ }
      - run: npx playwright test --shard=${{ matrix.shard }} --reporter=blob
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ strategy.job-index }}
          path: blob-report/

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: blob-*, path: all-blobs, merge-multiple: true }
      - run: npx playwright merge-reports --reporter html ./all-blobs
      - uses: actions/upload-artifact@v4
        with: { name: html-report, path: playwright-report/ }
