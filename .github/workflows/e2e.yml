name: RBI E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://stg-rbi.webc.in
        type: string
      coverage:
        description: Coverage level
        default: smoke
        type: choice
        options:
          - smoke
          - full
  schedule:
    - cron: '30 1 * * *' # nightly 07:00 IST
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rbi-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ inputs.base_url || 'https://stg-rbi.webc.in' }}
  HTTP_USER: ${{ secrets.HTTP_USER }}
  HTTP_PASS: ${{ secrets.HTTP_PASS }}
  RUN_FULL: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && 'true' || 'false' }}
  TEST_GREP: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && '.*' || '@smoke' }}
  MAX_PAGES: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && '2000' || '150' }}
  MAX_PER_SECTION: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && '100' || '15' }}
  PAGE_CHECK_LIMIT: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && '0' || '75' }}
  A11Y_PAGE_LIMIT: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && '200' || '20' }}
  LINK_CHECK_LIMIT: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && '0' || '1000' }}
  INTERACTION_PAGE_LIMIT: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && '50' || '5' }}
  CHECK_EXTERNAL_LINKS: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && 'true' || 'false' }}

jobs:
  e2e:
    name: Test and build reports
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Validate TypeScript and test discovery
        run: |
          npm run typecheck
          npx playwright test --list --grep "$TEST_GREP" --reporter=line

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Discover site pages for full coverage
        if: env.RUN_FULL == 'true'
        run: npm run crawl

      # continue-on-error lets both reports build before the final step restores
      # the correct failed status for the workflow.
      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npx playwright test --grep "$TEST_GREP"

      - name: Set up Java for Allure
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Allure report
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: npm run report:allure

      - name: Upload Playwright HTML report
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Allure report
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the test result
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Tests failed. Reports were generated and uploaded above."
          exit 1
